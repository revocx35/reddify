name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Server tests
        run: cd server && npm ci && npx tsc --noEmit && npm test
      - name: Web build
        run: cd web && npm ci && npm run build
      - name: Capture engine tests
        run: cd capture && npm ci && npx tsc --noEmit && npm test
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Chromium manager tests
        run: cd chromium/manager && CGO_ENABLED=0 go test ./...
  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build images (no push)
        run: |
          docker build -t reddify-app:ci .
          docker build -t reddify-chromium:ci chromium
          docker build -t reddify-capture:ci -f capture/Dockerfile .
          docker build -t reddify-caddy:ci caddy
